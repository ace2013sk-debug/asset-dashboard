<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:#182033;font-size:13px;line-height:1.5;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#dashboardViewport{height:100vh}
.app{display:flex;height:100vh}
/* ===== 사이드바 (공통 기준: 165px) ===== */
.sidebar{width:165px;flex:0 0 165px;display:flex;flex-direction:column;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-right:1px solid rgba(64,93,230,.14);height:100vh}
.brand{height:62px;padding:0 13px;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#e1306c,#833ab4,#405de6);color:#fff;font-size:14px;font-weight:800}
.brand-mark{width:20px;height:20px;flex:0 0 20px}
.brand b{display:block}
.menu{display:grid;grid-auto-rows:max-content;gap:2px;flex:1 1 0%;min-height:0;overflow:hidden auto;padding:18px 14px;scrollbar-width:thin;scrollbar-color:rgba(225,48,108,.56) rgba(64,93,230,.08)}
.menu::-webkit-scrollbar{width:8px}
.menu::-webkit-scrollbar-track{background:rgba(64,93,230,.06);border-radius:999px}
.menu::-webkit-scrollbar-thumb{border:2px solid rgba(255,255,255,.74);border-radius:999px;background:linear-gradient(rgba(225,48,108,.62),rgba(131,58,180,.45))}
.menu-label{font-size:11px;font-weight:700;color:#a0a7b5;padding:8px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:5px 11px;border:0;border-radius:16px;background:none;color:#4a5470;font-size:13px;font-weight:600;text-align:left;width:100%;line-height:1.25}
.nav-item:hover{background:rgba(64,93,230,.06)}
.nav-item.active{background:linear-gradient(135deg,rgba(225,48,108,.12),rgba(131,58,180,.09));color:#e1306c;font-weight:700;box-shadow:inset 0 0 0 1px rgba(225,48,108,.09)}
.nav-icon{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;box-shadow:inset 0 0 0 1px rgba(225,48,108,.18)}
/* ===== 본문 ===== */
.main{flex:1;min-width:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 22px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:1px 14px;min-height:45px;border-radius:18px;background:rgba(255,255,255,.9);border:1px solid #e1e6f2;box-shadow:0 12px 28px rgba(64,93,230,.07);backdrop-filter:blur(14px);flex:0 0 auto}
.topbar .ttl{font-size:15px;font-weight:800;letter-spacing:-.3px}
.topbar .sp{flex:1}
.seg{display:inline-flex;background:#eef1fb;border-radius:12px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:10px;font-size:12px;font-weight:700;color:#6a7390}
.seg button.on{background:#fff;color:#405de6;box-shadow:0 2px 8px rgba(64,93,230,.15)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#4a5470}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(225,48,108,.1);color:#e1306c}
.tag.blue{background:rgba(64,93,230,.1);color:#405de6}
.tag.amber{background:rgba(252,175,69,.2);color:#b36b00}
h1{font-size:24px;font-weight:700;letter-spacing:-.6px;margin:2px 2px 0}
.sub{color:#6a7390;margin:0 2px 2px;font-size:12.5px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(64,93,230,.18);border-radius:24px;box-shadow:0 9px 28px rgba(42,53,92,.07);padding:16px 18px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.3px}
.card .note{color:#7a8399;font-size:11.5px;margin:0 0 8px}
.kpi .lb{font-size:12px;color:#7a8399;font-weight:700}
.kpi .vl{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:2px 0}
.kpi .sb{font-size:11.5px;color:#7a8399}
.pos{color:#12915f}.neg{color:#e1306c}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#f3f5fc;color:#5a6481;font-weight:800;text-align:right;padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;text-align:right;border-bottom:1px solid #edf0f8;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
tr.flag td{background:rgba(252,175,69,.12)}
.ins{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ins li{padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(64,93,230,.05),rgba(225,48,108,.04));border:1px solid rgba(64,93,230,.1)}
.ins b{font-weight:800}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#eef1fb}
.bar i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:#5a6481;margin:6px 0}
.lg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
svg text{font-family:inherit}
#tip{position:fixed;z-index:50;pointer-events:none;background:#182033;color:#fff;padding:6px 10px;border-radius:10px;font-size:11.5px;display:none;white-space:pre-line;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.scroll{overflow:auto}
/* 챗봇 */
.chat{flex:0 0 auto;margin-top:auto;padding:12px 14px 16px;border-top:1px solid rgba(64,93,230,.14)}
#cbFab{position:static;display:flex;width:100%;height:42px;border-radius:16px;border:0;background:linear-gradient(135deg,#e1306c,#833ab4,#405de6);color:#fff;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;padding:0 11px}
#cbFab:hover{filter:brightness(1.06)}
#cbFab .cb-ic{font-size:16px;line-height:1}
#cbPanel{position:fixed;left:178px;bottom:16px;width:340px;max-height:70vh;display:none;flex-direction:column;background:#fff;border:1px solid rgba(64,93,230,.18);border-radius:24px;box-shadow:0 24px 60px rgba(42,53,92,.22);z-index:40;overflow:hidden}
#cbPanel.open{display:flex}
#cbPanel .hd{background:linear-gradient(135deg,#e1306c,#833ab4,#405de6);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;font-weight:800}
#cbPanel .hd button{margin-left:auto;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:700}
#cbLog{padding:12px 14px;overflow:auto;flex:1;display:grid;gap:8px;align-content:start;min-height:120px}
.msg{padding:8px 12px;border-radius:14px;font-size:12.5px;max-width:92%}
.msg.u{justify-self:end;background:rgba(64,93,230,.1)}
.msg.a{background:#f5f6fb}
#cbQs{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #edf0f8;max-height:130px;overflow:auto}
#cbQs button{border:1px solid rgba(64,93,230,.25);background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;color:#405de6}
#cbIn{display:flex;gap:6px;padding:8px 12px 12px}
#cbIn input{flex:1;border:1px solid #dfe4f2;border-radius:12px;padding:7px 10px;font-size:12.5px;font-family:inherit}
#cbIn button{border:0;border-radius:12px;background:#405de6;color:#fff;padding:0 12px;font-weight:800}
.warn{border-left:4px solid #fcaf45;background:rgba(252,175,69,.1);padding:8px 12px;border-radius:10px;font-size:12px;color:#7a5200}
#modeBtn{display:flex;flex-direction:column;width:100%;height:46px;margin-top:8px;border-radius:16px;border:1.5px solid #833ab4;background:#fff;color:#833ab4;align-items:center;justify-content:center;gap:1px;font-size:13px;font-weight:800;padding:0 11px;cursor:pointer}#modeBtn small{font-size:10.5px;font-weight:700;color:#7a8399}#modeBtn:hover{background:#f6effb}

}

function holdings(){
  const m={};
  for(const o of owners())for(const h of B[o].inv){
    const key=o+'|'+h.name;
    if(!m[key])m[key]={o,name:h.name,cost:0,value:0};
    m[key].cost+=h.cost;m[key].value+=h.value;
  }
  return Object.values(m).sort((a,b)=>b.value-a.value);
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(labels,series,opt={}){
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm;
  const vals=series.flatMap(s=>s.vals.filter(v=>v!=null));
  let mn=Math.min(0,...vals),mx=Math.max(...vals);
  const rng=mx-mn||1;mx=mn+niceMax(rng);
  const x=i=>L+(labels.length<2?iw/2:i*iw/(labels.length-1));
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${(v/E).toFixed(1)}</text>`}
  const step=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`});
  let p='';
  series.forEach(s=>{
    let d='',open=false;
    s.vals.forEach((v,i)=>{if(v==null){return}d+=(d?'L':'M')+x(i)+','+y(v)});
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.vals.forEach((v,i)=>{if(v==null)return;const f=s.flags&&s.flags[i];
      p+=`<circle cx="${x(i)}" cy="${y(v)}" r="${f?5:3.4}" fill="${f?'#fff':s.color}" stroke="${s.color}" stroke-width="2" data-tip="${s.name} ${labels[i]}\n${fE(v)}${f?'\n⚠ 이상치 의심':''}"/>`});
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}${p}</svg>`+legend(series.map(s=>[s.name,s.color]).concat(series.some(s=>s.flags)?[['○ 이상치 의심','#fcaf45']]:[]));
}
function legend(items){return `<div class="lg">${items.map(i=>`<span style="--c:${i[1]}">${i[0]}</span>`).join('')}</div>`}
function stackBars(labels,groups,opt={}){
  // groups: [{name, parts:[{name,color,vals}]}] 각 월에 막대 쌍
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm;
  let mx=0;groups.forEach(g=>labels.forEach((_,i)=>{mx=Math.max(mx,sum(g.parts.map(p=>p.vals[i])))}));mx=niceMax(mx);
  const y=v=>T+ih-v/mx*ih;const bw=iw/labels.length;
  let s='';
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${fM(v)}</text>`}
  labels.forEach((l,i)=>{
    const x0=L+i*bw+bw*.12,w=bw*.34;
    s+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`;
    groups.forEach((g,gi)=>{let acc=0;const xx=x0+gi*(w+bw*.06);
      g.parts.forEach(p=>{const v=p.vals[i];if(!v)return;const h=v/mx*ih;
        s+=`<rect x="${xx}" y="${y(acc+v)}" width="${w}" height="${h}" fill="${p.color}" rx="2" data-tip="${l} ${g.name}·${p.name}\n${fM(v)}만 원"/>`;acc+=v});
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function hbars(items,fmt){
  const mx=Math.max(...items.map(i=>i.v))||1;
  return items.map(i=>`<div style="display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;margin:6px 0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${i.l}">${i.l}</div><div class="bar"><i style="width:${i.v/mx*100}%;background:${i.c}" data-tip="${i.l}\n${fmt(i.v)}"></i></div><div style="text-align:right;font-weight:700">${i.t||fmt(i.v)}</div></div>`).join('');
}

VIEWS.man=()=>`<h1>매뉴얼</h1><p class="sub">데이터 출처와 화면 해석 방법</p>
  <div class="card"><h3>데이터 출처</h3><ul class="ins"><li>이 화면은 <b>가상 가족의 샘플 데이터</b>입니다. 실제 자산·부채·보유 종목과 무관하며, 모든 이름·금액·종목은 임의로 만든 값입니다.</li><li>실제 화면은 사이드바의 <b>샘플/리얼</b> 버튼으로 전환할 수 있습니다.</li></ul></div>
  <div class="card"><h3>화면 해석</h3><ul class="ins"><li><b>월별 값</b>: 같은 달 스냅샷이 여러 개면 마지막 것을 사용합니다.</li><li><b>합산</b>: 아빠·엄마 스냅샷이 모두 있는 달만 계산합니다.</li><li><b>이상치</b>: 직전 월 대비 −25% 이상 하락 후 회복한 달을 표시합니다. 상단 체크박스로 숨깁니다.</li><li><b>연 이자 추정</b>: 잔액×금리이며 실제 납부액과 다를 수 있습니다.</li><li><b>레버리지 표기</b>: 종목명 문구로만 판정합니다.</li></ul></div>
  <div class="card"><h3>샘플 데이터 안내</h3><ul class="ins"><li>가상 데이터이므로 공유해도 개인정보 문제가 없습니다.</li></ul></div>`;
function divBars(labels,series,opt={}){
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm,st2=!!opt.stack;
  const U=1e6,bw=iw/labels.length;let mn=0,mx=0;
  labels.forEach((_,i)=>{if(st2){let p=0,n=0;series.forEach(s=>{const v=(s.vals[i]||0)/U;v>=0?p+=v:n+=v});mx=Math.max(mx,p);mn=Math.min(mn,n)}else series.forEach(s=>{const v=(s.vals[i]||0)/U;mx=Math.max(mx,v);mn=Math.min(mn,v)})});
  if(opt.line)opt.line.vals.forEach(v=>{if(v!=null){mx=Math.max(mx,v/U);mn=Math.min(mn,v/U)}});
  const step=niceMax((mx-mn)/4||1);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;if(opt.vl)mx+=step;
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;let s='';
  for(let v=mn;v<=mx+1e-9;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa3b8':'#e8ecf7'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${Math.round(v)}</text>`;
  labels.forEach((l,i)=>{
    s+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`;
    if(st2){let p=0,n=0;const w=bw*.5,x0=L+i*bw+(bw-w)/2;series.forEach(se=>{const v=(se.vals[i]||0)/U;if(!v)return;const y1=v>=0?y(p+v):y(n),h=Math.abs(v)/(mx-mn)*ih;s+=`<rect x="${x0}" y="${y1}" width="${w}" height="${h}" fill="${se.color}" data-tip="${l} ${se.name}\n${v>0?'+':''}${v.toFixed(1)}백만 원"/>`;v>=0?p+=v:n+=v})}
    else{const k=series.length,w=bw*.78/k,x0=L+i*bw+bw*.11;series.forEach((se,j)=>{const raw=se.vals[i];if(raw==null)return;const v=raw/U;s+=`<rect x="${x0+j*w}" y="${v>=0?y(v):y(0)}" width="${w*.92}" height="${Math.max(1,Math.abs(v)/(mx-mn)*ih)}" fill="${se.color}" rx="2" data-tip="${l} ${se.name}\n${v>0?'+':''}${v.toFixed(1)}백만 원"/>`+(opt.vl?`<text x="${x0+j*w+w*.5}" y="${(v>=0?y(v)-4:y(v)+4)}" text-anchor="${v>=0?'start':'end'}" font-size="${opt.vl}" fill="#182033" transform="rotate(-90 ${x0+j*w+w*.5} ${(v>=0?y(v)-4:y(v)+4)})">${(opt.sign||se.sign)&&v>0?'+':''}${v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}).replace('-','−')}</text>`:'')})}
  });
  if(opt.line){const pts=labels.map((_,i)=>opt.line.vals[i]==null?null:[L+i*bw+bw/2,y(opt.line.vals[i]/U)]);let d='';pts.forEach(p=>{if(p)d+=(d?'L':'M')+p[0]+','+p[1]});s+=`<path d="${d}" fill="none" stroke="${opt.line.color}" stroke-width="2.4"/>`+pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="${opt.line.color}" stroke-width="2" data-tip="${labels[i]} ${opt.line.name}\n${(opt.line.vals[i]/U>0?'+':'')+(opt.line.vals[i]/U).toFixed(1)}백만 원"/>`:'').join('')}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`+legend(series.map(x=>[x.name,x.color]).concat(opt.line?[[opt.line.name,opt.line.color]]:[]));
}

   <div class="card kpi"><div class="lb">6번 증가분(12→${M[last].slice(5)}월)</div><div class="vl">${fm(R.l6[last]-R.l6[0])}</div><div class="sb">총자산−총부채 기준</div></div></div>
  <div class="card"><h3>금액 추이 (억 원)</h3><p class="note">3번은 누적 소득(흐름), 6번은 순자산(잔액) · 개념이 달라 수준 차이는 구조적입니다 · 3번 2026-10은 월 진행 중일 수 있음 [확인 필요]</p>${lineChart(M,[{name:'3번 누적 소득',color:'#405de6',vals:R.l3},{name:'6번 순자산',color:'#e1306c',vals:R.l6},{name:'6번 이상치 보정',color:'#fcaf45',vals:R.l6a}])}</div>

  <div class="card"><h3>월별 차이 (6번 − 3번, 백만 원)</h3><p class="note">보정: 엄마 03·06월 이상치 보정</p>${divBars(M,[{name:'보고값',color:'#833ab4',vals:df},{name:'이상치 보정',color:'#fcaf45',vals:dfa}])}</div>
  <div class="card"><h3>월 증감 비교 (백만 원)</h3><p class="note">3번 월 총 소득 vs 6번 순자산 월 증감</p>${divBars(mm,[{name:'3번 월 증감',color:'#405de6',vals:d3.slice(1)},{name:'6번 월 증감',color:'#e1306c',vals:d6.slice(1)}],{line:{name:'증감 차이(6번−3번)',color:'#182033',vals:d6.slice(1).map((v,i)=>v-d3[i+1])}})}</div>

function ask(i,q){say(q,'u');say(QA[i][1](),'a')}
function reset(){log.innerHTML='';say('안녕하세요. 이 화면의 자산·투자 수치를 질문에 맞게 알려 드립니다. 투자 판단은 제공하지 않습니다.','a')}
$('#cbQs').innerHTML=QA.map((q,i)=>`<button type="button" data-i="${i}">${q[0]}</button>`).join('');
$('#cbQs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ask(+b.dataset.i,QA[+b.dataset.i][0])});
$('#cbIn').addEventListener('submit',e=>{e.preventDefault();const v=$('#cbText').value.trim();if(!v)return;const k=KW.find(x=>x[0].test(v));if(k)ask(k[1],v);else{say(v,'u');say('질문을 이해하지 못했습니다. 아래 질문 버튼을 눌러 보세요.','a')}$('#cbText').value=''});
$('#cbFab').addEventListener('click',()=>$('#cbPanel').classList.toggle('open'));
$('#cbClose').addEventListener('click',()=>$('#cbPanel').classList.remove('open'));
$('#cbReset').addEventListener('click',reset);
reset();
render();
</script>
</body>
</html>

.topbar .ttl{font-size:15px;font-weight:800;letter-spacing:-.3px}

.seg{display:inline-flex;background:#eef1fb;border-radius:12px;padding:2px}

.card{background:rgba(255,255,255,.96);border:1px solid rgba(64,93,230,.18);border-radius:24px;box-shadow:0 9px 28px rgba(42,53,92,.07);padding:16px 18px;min-width:0}

.scroll{overflow:auto}

#cbFab{position:static;display:flex;width:100%;height:42px;border-radius:16px;border:0;background:linear-gradient(135deg,#e1306c,#833ab4,#405de6);color:#fff;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;padding:0 11px}

function nwSeries(){

function loanSplit(o){
  const dep=B[o].loan.filter(l=>l.rate==null||l.rate===undefined).reduce((a,l)=>a+(l.balance||0),0);
  const fin=B[o].loan.filter(l=>l.rate!=null).reduce((a,l)=>a+(l.balance||0),0);

}
function allLoans(){const r=[];for(const o of owners())for(const l of B[o].loan)r.push({...l,o});return r}

/* 투자 종목 합산 */
function holdings(){
  const m={};
  for(const o of owners())for(const h of B[o].inv){
    const key=o+'|'+h.name;
    if(!m[key])m[key]={o,name:h.name,cost:0,value:0};
    m[key].cost+=h.cost;m[key].value+=h.value;
  }
  return Object.values(m).sort((a,b)=>b.value-a.value);
}

function lineChart(labels,series,opt={}){
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm;
  const vals=series.flatMap(s=>s.vals.filter(v=>v!=null));
  let mn=Math.min(0,...vals),mx=Math.max(...vals);
  const rng=mx-mn||1;mx=mn+niceMax(rng);
  const x=i=>L+(labels.length<2?iw/2:i*iw/(labels.length-1));
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;
  let g='';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${(v/E).toFixed(1)}</text>`}
  const step=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`});
  let p='';
  series.forEach(s=>{
    let d='',open=false;
    s.vals.forEach((v,i)=>{if(v==null){return}d+=(d?'L':'M')+x(i)+','+y(v)});

    s.vals.forEach((v,i)=>{if(v==null)return;const f=s.flags&&s.flags[i];
      p+=`<circle cx="${x(i)}" cy="${y(v)}" r="${f?5:3.4}" fill="${f?'#fff':s.color}" stroke="${s.color}" stroke-width="2" data-tip="${s.name} ${labels[i]}\n${fE(v)}${f?'\n⚠ 이상치 의심':''}"/>`});
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}${p}</svg>`+legend(series.map(s=>[s.name,s.color]).concat(series.some(s=>s.flags)?[['○ 이상치 의심','#fcaf45']]:[]));
}
function legend(items){return `<div class="lg">${items.map(i=>`<span style="--c:${i[1]}">${i[0]}</span>`).join('')}</div>`}
function stackBars(labels,groups,opt={}){
  // groups: [{name, parts:[{name,color,vals}]}] 각 월에 막대 쌍
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm;
  let mx=0;groups.forEach(g=>labels.forEach((_,i)=>{mx=Math.max(mx,sum(g.parts.map(p=>p.vals[i])))}));mx=niceMax(mx);
  const y=v=>T+ih-v/mx*ih;const bw=iw/labels.length;
  let s='';
  for(let k=0;k<=4;k++){const v=mx*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e8ecf7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${fM(v)}</text>`}
  labels.forEach((l,i)=>{
    const x0=L+i*bw+bw*.12,w=bw*.34;
    s+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`;
    groups.forEach((g,gi)=>{let acc=0;const xx=x0+gi*(w+bw*.06);
      g.parts.forEach(p=>{const v=p.vals[i];if(!v)return;const h=v/mx*ih;
        s+=`<rect x="${xx}" y="${y(acc+v)}" width="${w}" height="${h}" fill="${p.color}" rx="2" data-tip="${l} ${g.name}·${p.name}\n${fM(v)}만 원"/>`;acc+=v});
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function hbars(items,fmt){
  const mx=Math.max(...items.map(i=>i.v))||1;
  return items.map(i=>`<div style="display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;margin:6px 0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${i.l}">${i.l}</div><div class="bar"><i style="width:${i.v/mx*100}%;background:${i.c}" data-tip="${i.l}\n${fmt(i.v)}"></i></div><div style="text-align:right;font-weight:700">${i.t||fmt(i.v)}</div></div>`).join('');
}

function divBars(labels,series,opt={}){
  const W=780,H=300,L=52,R=14,T=14,Bm=34,iw=W-L-R,ih=H-T-Bm,st2=!!opt.stack;
  const U=1e6,bw=iw/labels.length;let mn=0,mx=0;
  labels.forEach((_,i)=>{if(st2){let p=0,n=0;series.forEach(s=>{const v=(s.vals[i]||0)/U;v>=0?p+=v:n+=v});mx=Math.max(mx,p);mn=Math.min(mn,n)}else series.forEach(s=>{const v=(s.vals[i]||0)/U;mx=Math.max(mx,v);mn=Math.min(mn,v)})});
  if(opt.line)opt.line.vals.forEach(v=>{if(v!=null){mx=Math.max(mx,v/U);mn=Math.min(mn,v/U)}});
  const step=niceMax((mx-mn)/4||1);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;if(opt.vl)mx+=step;
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;let s='';
  for(let v=mn;v<=mx+1e-9;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#9aa3b8':'#e8ecf7'}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="#7a8399">${Math.round(v)}</text>`;
  labels.forEach((l,i)=>{
    s+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="#7a8399">${l.slice(2)}</text>`;
    if(st2){let p=0,n=0;const w=bw*.5,x0=L+i*bw+(bw-w)/2;series.forEach(se=>{const v=(se.vals[i]||0)/U;if(!v)return;const y1=v>=0?y(p+v):y(n),h=Math.abs(v)/(mx-mn)*ih;s+=`<rect x="${x0}" y="${y1}" width="${w}" height="${h}" fill="${se.color}" data-tip="${l} ${se.name}\n${v>0?'+':''}${v.toFixed(1)}백만 원"/>`;v>=0?p+=v:n+=v})}
    else{const k=series.length,w=bw*.78/k,x0=L+i*bw+bw*.11;series.forEach((se,j)=>{const raw=se.vals[i];if(raw==null)return;const v=raw/U;s+=`<rect x="${x0+j*w}" y="${v>=0?y(v):y(0)}" width="${w*.92}" height="${Math.max(1,Math.abs(v)/(mx-mn)*ih)}" fill="${se.color}" rx="2" data-tip="${l} ${se.name}\n${v>0?'+':''}${v.toFixed(1)}백만 원"/>`+(opt.vl?`<text x="${x0+j*w+w*.5}" y="${(v>=0?y(v)-4:y(v)+4)}" text-anchor="${v>=0?'start':'end'}" font-size="${opt.vl}" fill="#182033" transform="rotate(-90 ${x0+j*w+w*.5} ${(v>=0?y(v)-4:y(v)+4)})">${(opt.sign||se.sign)&&v>0?'+':''}${v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}).replace('-','−')}</text>`:'')})}
  });
  if(opt.line){const pts=labels.map((_,i)=>opt.line.vals[i]==null?null:[L+i*bw+bw/2,y(opt.line.vals[i]/U)]);let d='';pts.forEach(p=>{if(p)d+=(d?'L':'M')+p[0]+','+p[1]});s+=`<path d="${d}" fill="none" stroke="${opt.line.color}" stroke-width="2.4"/>`+pts.map((p,i)=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="${opt.line.color}" stroke-width="2" data-tip="${labels[i]} ${opt.line.name}\n${(opt.line.vals[i]/U>0?'+':'')+(opt.line.vals[i]/U).toFixed(1)}백만 원"/>`:'').join('')}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`+legend(series.map(x=>[x.name,x.color]).concat(opt.line?[[opt.line.name,opt.line.color]]:[]));
}

/* ===== 챗봇 ===== */
const QA=[
 ['합산 순자산은?',()=>{const t=B['성현'].net+B['지혜'].net;return `${D.last} 기준 합산 순자산은 ${fE(t)}입니다 (성현 ${fE(B['성현'].net)}, 지혜 ${fE(B['지혜'].net)}).`}],
 ['지혜 순자산 증가 폭은?',()=>{const a=D.nw['지혜']['2025-04'].net,b=B['지혜'].net;return `2025-04 ${fE(a)}에서 ${D.last} ${fE(b)}로 ${fE(b-a)}(${pct(b-a,a).toFixed(0)}%) 늘었습니다. 중간 이상치 월(2026-02·05·06)은 원인 확인이 필요합니다.`}],
 ['성현 투자 집중도는?',()=>{const s=B['성현'].inv,v=sum(s.map(i=>i.value)),h=sum(s.filter(i=>i.name==='SK하이닉스').map(i=>i.value));return `성현 투자현황 평가금액 ${fE(v)} 중 SK하이닉스(2계좌)가 ${fE(h)}로 ${pct(h,v).toFixed(0)}%입니다.`}],
 ['연 이자는 얼마인가요?',()=>{const L=[...B['성현'].loan,...B['지혜'].loan].filter(l=>l.rate!=null);return `금융 대출 잔액 ${fE(sum(L.map(l=>l.balance)))} 기준 연 이자 추정은 약 ${fM(interest(L))}만 원(월 ${fM(interest(L)/12)}만 원)입니다. 잔액×금리 단순 추정입니다.`}],
 ['부채는 어떻게 구성되나요?',()=>{let d=0,f=0;OWN.forEach(o=>{const s=loanSplit(o);d+=s.dep;f+=s.fin});return `총부채 ${fE(d+f)} 중 '전세 보증금' 항목이 ${fE(d)}, 금융 대출이 ${fE(f)}입니다. 보증금 항목의 성격은 확인이 필요합니다.`}],
 ['지출 미분류 비중은?',()=>{const j=D.cf.o['지혜'],s=D.cf.o['성현'];return `최근 ${D.cf.months.length}개월 기준 지혜 ${pct(sum(j.unclass),sum(j.expense)).toFixed(0)}%, 성현 ${pct(sum(s.unclass),sum(s.expense)).toFixed(0)}%입니다.`}],
 ['이상치 월은?',()=>`${D.flag.map(([o,m])=>o+' '+m+'('+fE(D.nw[o][m].net)+')').join(', ')}입니다. 상단 '이상치 월 제외'로 숨길 수 있습니다.`],
 ['3번과 월별 차이는?',()=>{const R=D.recon3,d=R.l6.map((v,i)=>v-R.l3[i]);return `${R.months[R.months.length-1]} 기준 6번 − 3번은 ${fE(d[d.length-1])}입니다 (2025-12 ${fE(d[0])}). 3번은 누적 소득, 6번은 잔액이라 수준이 아닌 월 증감으로 비교해야 합니다. '3번 월별 차이' 메뉴를 확인하십시오.`}],
 ['3번과 무엇이 다른가요?',()=>'3번은 소득·지출 흐름(2019~2026), 이 화면은 자산·부채·투자 구성(스냅샷)을 보여 줍니다. 순자산은 기준월이 달라 대사가 필요합니다.']
];
const KW=[[/순자산|합산/,0],[/증가|지혜/,1],[/집중|하이닉스|투자/,2],[/이자|금리|대출/,3],[/부채|보증금/,4],[/미분류|지출/,5],[/이상|급락/,6],[/월별.*차이|차이.*월별|대사/,7],[/3번|차이|다른/,8]];
const log=$('#cbLog');
function say(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
function ask(i,q){say(q,'u');say(QA[i][1](),'a')}
function reset(){log.innerHTML='';say('안녕하세요. 이 화면의 자산·투자 수치를 질문에 맞게 알려 드립니다. 투자 판단은 제공하지 않습니다.','a')}
$('#cbQs').innerHTML=QA.map((q,i)=>`<button type="button" data-i="${i}">${q[0]}</button>`).join('');
$('#cbQs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ask(+b.dataset.i,QA[+b.dataset.i][0])});
$('#cbIn').addEventListener('submit',e=>{e.preventDefault();const v=$('#cbText').value.trim();if(!v)return;const k=KW.find(x=>x[0].test(v));if(k)ask(k[1],v);else{say(v,'u');say('질문을 이해하지 못했습니다. 아래 질문 버튼을 눌러 보세요.','a')}$('#cbText').value=''});
$('#cbFab').addEventListener('click',()=>$('#cbPanel').classList.toggle('open'));
$('#cbClose').addEventListener('click',()=>$('#cbPanel').classList.remove('open'));
$('#cbReset').addEventListener('click',reset);
reset();
render();
</script>
</body>
</html>
